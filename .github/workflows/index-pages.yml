name: "Index: Pages"

on:
  workflow_dispatch:
  schedule:
    # Run twice weekly at 03:00 UTC on Tuesdays and Fridays
    - cron: '0 3 * * 2,5'

permissions:
  contents: write

jobs:
  run-pages-job:
    name: Update Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_INDEX_TOKEN }}

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run docs pages job
        run: npm exec tsx -w backend -- ./src/jobs/docsPagesJob.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INDEX_TOKEN }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_DIR: ./data

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "index: update pages"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
