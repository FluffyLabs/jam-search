name: "Index: GitHub"

on:
  workflow_dispatch:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  run-github-pages-job:
    name: Update GitHub repos
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run GitHub pages job
        run: npm exec tsx -w backend -- ./src/jobs/githubPagesJob.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INDEX_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data

      - uses: ./.github/actions/commit-data
        with:
          commit-message: "index: update github pages"
