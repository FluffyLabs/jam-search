name: "Index: Matrix"

on:
  workflow_dispatch:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  run-matrix-job:
    name: Update Matrix Messages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_INDEX_TOKEN }}

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Matrix job
        run: npm exec tsx -w backend -- ./src/jobs/matrixJob.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GH_INDEX_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATA_DIR: ${{ github.workspace }}/data

      - uses: ./.github/actions/commit-data
        with:
          commit-message: "index: update matrix messages"
