name: "Index: Graypaper"

on:
  workflow_dispatch:
  schedule:
    # Run daily at 05:00 UTC
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  run-graypaper-job:
    name: Update Graypaper
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js with cache
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run graypaper job
        run: npm exec tsx -w backend -- ./src/jobs/graypaperJob.ts
        env:
          DATA_DIR: ${{ github.workspace }}/data

      - uses: ./.github/actions/commit-data
        with:
          commit-message: "index: update graypaper"
